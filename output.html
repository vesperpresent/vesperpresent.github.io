<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vespa Screen</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:wght@400;500;600;700&family=Montserrat:wght@400;600;700;800&family=Oswald:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/vespa.css">
<style>
html, body { height: 100%; background: #000; overflow: hidden; }
body.idle { cursor: none; }
#wrap { position: fixed; inset: 0; }
#wrap .vs-stage { position: absolute; left: 50%; top: 50%; transform-origin: 0 0; }
.hint { position: fixed; left: 8px; bottom: 8px; background: #ffffe1; color: #000; border: 1px solid #000; padding: 3px 8px; font: 12px Verdana, sans-serif; z-index: 10; }
.sd { position: fixed; inset: 0; background: #000; color: #fff; display: grid; grid-template-rows: auto 1fr auto auto; padding: 2vh 3vw; gap: 2vh; font-family: Verdana, Tahoma, sans-serif; }
.sd-top { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid #444; padding-bottom: 1vh; font-size: 3vh; color: #aaa; }
#clk, #tmr { font: bold 6vh "Courier New", monospace; color: #fff; }
#tmr { color: #ffff66; }
#tmr.over { color: #ff4444; }
.sd-now { display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
.sd-label { font-size: 2.6vh; color: #ff6666; font-weight: bold; margin-bottom: 1vh; }
.sd-text { font-size: 7vh; font-weight: bold; line-height: 1.2; white-space: pre-line; }
.sd-sub { font-size: 3.4vh; color: #aaa; margin-top: 1vh; }
.sd-next { border-top: 2px solid #444; padding-top: 1.5vh; font-size: 3.6vh; color: #9fc5ff; max-height: 20vh; overflow: hidden; }
.sd-msg { background: #ffff66; color: #000; padding: 1.2vh 2vh; font-size: 4.4vh; font-weight: bold; text-align: center; border: 3px solid #fff; }
</style>
</head>
<body>
<script src="assets/js/core.js"></script>
<script src="assets/js/output.js"></script>
</body>
</html>
