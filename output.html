<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vespa Output</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:wght@400;500;600;700&family=Montserrat:wght@400;600;700;800&family=Oswald:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/vespa.css">
<style>
html, body { height: 100%; background: #000; overflow: hidden; }
body.idle { cursor: none; }
#wrap { position: fixed; inset: 0; display: grid; place-items: center; }
#wrap .vs-stage { position: absolute; left: 50%; top: 50%; transform-origin: 0 0; }
.hint { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: rgba(20, 20, 26, .85); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; transition: opacity .4s; z-index: 10; pointer-events: none; }
.hint.off { opacity: 0; }
.sd { position: fixed; inset: 0; background: #08080a; color: #f2f2f5; display: grid; grid-template-rows: auto 1fr auto auto; padding: 3vh 4vw; gap: 2.5vh; font-family: var(--font); }
.sd-top { display: flex; align-items: center; justify-content: space-between; color: #8e8e9a; font-size: 2.4vh; }
.sd-clock { font: 600 6vh var(--font); color: #fff; font-variant-numeric: tabular-nums; }
.sd-timer { font: 600 6vh var(--font); font-variant-numeric: tabular-nums; color: #9a90ff; }
.sd-timer.over { color: #ff5a5f; }
.sd-now { display: flex; flex-direction: column; justify-content: center; min-height: 0; overflow: hidden; }
.sd-label { font-size: 2.4vh; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #ff5a5f; margin-bottom: 1.5vh; }
.sd-text { font-size: 7vh; font-weight: 650; line-height: 1.2; white-space: pre-line; }
.sd-sub { font-size: 3.4vh; color: #8e8e9a; margin-top: 1.5vh; }
.sd-next { border-top: 1px solid #222228; padding-top: 2vh; color: #8e8e9a; font-size: 3.6vh; line-height: 1.3; white-space: pre-line; max-height: 22vh; overflow: hidden; }
.sd-next b { display: block; font-size: 2vh; letter-spacing: .08em; text-transform: uppercase; color: #5e5e68; margin-bottom: .8vh; }
.sd-msg { background: #5b4cf0; color: #fff; border-radius: 1.4vh; padding: 1.6vh 2.4vh; font-size: 4vh; font-weight: 600; text-align: center; }
.sd-state { color: #ff5a5f; font-size: 2.4vh; font-weight: 600; }
</style>
</head>
<body>
<script src="assets/js/core.js"></script>
<script src="assets/js/output.js"></script>
</body>
</html>
