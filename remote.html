<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vespa Remote</title>
<meta name="description" content="Control the Vespa projector from your phone.">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/img/logo.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="assets/css/vespa.css">
<style>
body { font-size: 14px; }
.r { max-width: 520px; margin: 0 auto; padding-bottom: 20px; }
.now { background: var(--panel); border: 1px solid var(--line-2); padding: 8px; min-height: 110px; margin: 8px; }
.now .tx { font-size: 18px; font-weight: bold; margin-top: 6px; white-space: pre-line; }
.now .lb { color: var(--live); font-weight: bold; font-size: 12px; margin-top: 6px; }
.nav { display: grid; grid-template-columns: 1fr 1.5fr; gap: 6px; margin: 8px; }
.nav .btn { height: 60px; font-size: 18px; }
.ctrls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 0 8px; }
.ctrls .btn { height: 40px; font-size: 12px; white-space: normal; }
.tabs { margin: 12px 8px 6px; }
.list { padding: 0 8px; }
.list table.list { table-layout: fixed; }
.list table.list td.n { width: 34px; }
.list table.list td { padding: 8px 6px; font-size: 13px; cursor: pointer; }
.list table.list tr.on td { background: #ffd9d9; color: #000; font-weight: bold; }
.dot { display: inline-block; width: 8px; height: 8px; border: 1px solid #000; background: #999; }
.dot.on { background: #00aa00; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://kaidaz18.duckdns.org/sdk/bread-client.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/remote.js"></script>
</body>
</html>
